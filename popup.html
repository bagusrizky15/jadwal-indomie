<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Jadwal Indomie</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="seg" role="group" aria-label="Tampilan">
      <button data-tab="today">Hari ini</button>
      <button data-tab="month">Bulan</button>
    </div>
    <div class="actions">
    <button id="theme" class="icon">
      <svg id="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
      </svg>
      <svg id="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden>
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
      </svg>
    </button>
    <button data-tab="settings" class="icon" aria-label="Pengaturan" title="Pengaturan">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke-width="3" stroke-dasharray="3.34 3.34"/>
        <circle cx="12" cy="12" r="6" stroke-width="3"/>
      </svg>
    </button>
    </div>
  </header>

  <p id="warn" hidden></p>

  <section id="today">
    <div id="card">
      <div id="card-date"></div>
      <div id="card-status"></div>
      <div id="card-sub"></div>
      <button id="setup" class="primary" hidden>Atur Jadwal WFH</button>
    </div>
    <div id="strip"></div>
    <p id="card-next"></p>
  </section>

  <section id="month" hidden>
    <header>
      <strong id="month-title"></strong>
      <button id="goto-today" class="link">Hari ini</button>
      <button id="prev" class="icon" aria-label="Bulan sebelumnya">‹</button>
      <button id="next" class="icon" aria-label="Bulan berikutnya">›</button>
    </header>
    <div id="grid"></div>
    <p id="summary"></p>
  </section>

  <section id="settings" hidden>
    <h2>Pola kerja</h2>
    <div class="row">
      <label><input type="number" id="wfh" min="1" max="20" step="1"> hari WFH</label>
      <label><input type="number" id="wfo" min="1" max="20" step="1"> hari WFO</label>
    </div>
    <p class="hint">Diulang terus; libur dan weekend dilewati.</p>

    <h2>Hari WFH saya</h2>
    <input type="date" id="anchor" aria-label="Hari WFH saya">
    <p class="hint">Hari WFH pertama dalam satu siklus (hari kerja). Boleh diubah kapan saja.</p>

    <h2>Tambah libur</h2>
    <textarea id="paste" rows="4" aria-label="Daftar libur" placeholder="2026-01-01 Tahun Baru&#10;2026-03-20 Cuti Bersama"></textarea>
    <p class="hint">Satu per baris: tanggal (YYYY-MM-DD), lalu label opsional.</p>
    <div class="row">
      <button id="add" class="primary">Tambah</button>
      <button id="fetch" class="secondary">Fetch dari Internet</button>
    </div>
    <p id="msg" role="status"></p>

    <h2>Daftar libur</h2>
    <ul id="holidays"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
